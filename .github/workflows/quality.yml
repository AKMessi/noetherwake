name: Quality gates
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npx tsx scripts/contrast.ts
      - run: npm run eval
      - run: npm run build
      - run: npx playwright install chromium
      - name: Capture responsive production screens
        run: |
          npx serve out -l 3001 &
          for attempt in {1..20}; do
            curl -fsS http://127.0.0.1:3001/ >/dev/null && break
            sleep 1
          done
          QA_ORIGIN=http://127.0.0.1:3001 npx tsx scripts/working-page-preview.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: launch-lab-screens
          path: |
            docs/images/launch-lab/*-opening.png
            docs/images/launch-lab/*-lab-tested.png
            docs/images/launch-lab/*-returning.png
            docs/images/launch-lab/*-lesson.png
            docs/images/launch-lab/*-atlas-selected.png
            docs/images/launch-lab/*-preferences.png
            docs/launch-lab-preview.json
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-evidence
          path: |
            docs/eval-results.json
            docs/build-metrics.json
            docs/perf-results.json
            docs/working-page-contrast.json
            playwright-report/
